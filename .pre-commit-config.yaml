repos:
  - repo: local
    hooks:
      - id: php-lint
        name: PHP Syntax Check
        entry: scripts/run-php-lint.sh
        language: system
        pass_filenames: false
        files: \.php$
      - id: composer-no-dev
        name: Block Composer require-dev in git index
        entry: scripts/check-composer-no-dev.sh
        language: system
        pass_filenames: false
        always_run: true

